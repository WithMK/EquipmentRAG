equipment:
  name: replace-with-equipment-name

source:
  path: D:/EquipmentData/source
  include_extensions:
    - .cs
  exclude_directories:
    - bin
    - obj
    - .git
    - .vs
    - Debug
    - Release
    - packages
  chunk_size: 4000
  chunk_overlap: 400

document:
  enabled: false
  source_paths:
    - D:/EquipmentData/documents
  extensions:
    - .docx
    - .pdf
    - .pptx
    - .xlsx
    - .md
    - .txt
  exclude_directories:
    - .git
    - .vs
    - archive
  chunk_size: 3000
  chunk_overlap: 300
  collection_name: document_chunks

visual:
  enabled: false
  tesseract_path: null
  languages: kor+eng
  timeout_seconds: 60
  pdf_dpi: 200
  pdf_ocr: true
  pptx_image_ocr: true
  xlsx_chart_extraction: true

embedding:
  model_path: D:/OfflineAssets/models/embedding/bge-m3
  batch_size: 16
  device: null
  normalize_embeddings: true

chromadb:
  path: D:/OfflineRuntime/EquipmentRAG/chroma
  collection_name: equipment_code

search:
  top_k: 5
  mode: semantic
  candidate_multiplier: 4
  semantic_weight: 0.7
  lexical_weight: 0.3
  exact_match_enabled: true
  lexical_backend: sqlite_fts5
  lexical_path: D:/OfflineRuntime/EquipmentRAG/lexical/equipment_fts.db
  rrf_k: 60
  reranker_model_path: null
  reranker_weight: 0.5
  reranker_device: null

llm:
  provider: llama_cpp
  base_url: http://127.0.0.1:8080/v1
  model: local-model
  request_timeout_seconds: 120

logging:
  level: INFO
  path: D:/OfflineRuntime/EquipmentRAG/logs/equipment_rag.log
