equipment:
  name: replace-with-equipment-name

source:
  path: D:/EquipmentData/source
  include_extensions: [.cs]
  exclude_directories: [bin, obj, .git, .vs, Debug, Release, packages]
  chunk_size: 4000
  chunk_overlap: 400

document:
  enabled: false
  source_paths: [D:/EquipmentData/documents]
  extensions: [.docx, .pdf, .pptx, .xlsx, .md, .txt]
  exclude_directories: [.git, .vs, archive]
  chunk_size: 3000
  chunk_overlap: 300
  collection_name: document_chunks

embedding:
  backend: llama_cpp
  model_path: D:/OfflineAssets/models/embedding/bge-m3-Q4_0.gguf
  base_url: http://127.0.0.1:8081/v1
  model: bge-m3-q4
  dimension: 1024
  request_timeout_seconds: 120
  batch_size: 16
  device: null
  normalize_embeddings: true

chromadb:
  path: D:/OfflineRuntime/EquipmentRAG/chroma-gguf-q4
  collection_name: equipment_code

search:
  top_k: 5

llm:
  provider: llama_cpp
  base_url: http://127.0.0.1:8080/v1
  model: local-model
  request_timeout_seconds: 120

logging:
  level: INFO
  path: D:/OfflineRuntime/EquipmentRAG/logs/equipment_rag.log
